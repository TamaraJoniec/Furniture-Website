<!DOCTYPE html>
<html lang="en-gb">
<head>
  <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet" type="text/css">
  <title>Furniture Homepage</title>
</head>
<body>
  <nav id="navBar">
    <h1>Furniture</h1>
    <div id="navigation">
      <p class="highlight">New In</p>
      <p>Furniture</p>
      <p>Rest</p>
      <p>Decoration</p>
      <p>Outdoor</p>
      <p>Magazine</p>
      <p>Outlet</p>
    </div>
    <div class="icons">
      <img src="images/user.png"  alt="User profile icon">
      <img src="images/search.png" alt="Search icon">
      <img src="images/shopping-bag.png" alt="Shopping bag icon">
    </div>
  </nav>
  <section id="heroGrid">
    <div id="featuredProduct" class="heroGridArea">
      <div id="headline">
        <h3 id="newCollection">New Collection</h3>
        <h2>Chairs & Stools</h2>
        <p>Armchair upholstered in synthetic leather. Powder coated steel legs.</p>
      </div>
    </div>
    <div id="secondaryProduct" class="heroGridArea"></div>
    <div id="CTA" class="heroGridArea">
      <h4>Shop Now</h4>
      <img src="images/arrow-right.png" alt="Arrow pointing right">
    </div>
    <div class="subHeaading">
      <h3>Shop by category</h3>
      <section id="categoryGrid">
        <div id="bookcases" alt="bookcases" class="categoryGridarea">
          <div class="heading">Bookcases</div>
        </div>
        <div id="bedroom" alt="bedroom"class="categoryGridarea">
          <div class="heading">Bedroom</div>
        </div>
        <div id="couches" alt="couches" class="categoryGridarea">
          <div class="heading">Couches</div>
        </div>
        <div id="patio" alt="patio" class="categoryGridarea">
          <div class="heading">Patio</div>
        </div>
        <div id="desks" alt="desks" class="categoryGridarea">
          <div class="heading">Desks</div>
        </div>
      </section>
    </div>
 </body>
</html>
